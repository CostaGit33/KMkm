<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0e0f" />
    <meta name="color-scheme" content="dark light" />
    <style>html[data-theme="dark"], html[data-theme="dark"] body { background: #0e0e0f; }</style>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem("mais1km-eunapolis:v4"));
        if (s && s.themeChosen === true && s.theme === "light") document.documentElement.dataset.theme = "light";
      } catch (e) {}
    </script>
    <meta name="description" content="+1 KM: uma caderneta permanente para explorar Eunápolis, guardar carimbos e ganhar XP." />
    <title>+1 KM · Eunápolis</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/stamp.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/future.css" />
    <link rel="stylesheet" href="/src/intro.css" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar" id="topbar"></header>
      <div class="workspace">
        <aside class="side-rail" id="side-rail" aria-label="Navegação principal"></aside>
        <main id="app" class="main-content" tabindex="-1" aria-live="polite"></main>
      </div>
    </div>
    <nav id="bottom-nav" class="bottom-nav" aria-label="Navegação principal"></nav>
    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="drawer-root"></div>
    <div id="dialog-root"></div>
    <noscript><p class="noscript">Este caderno precisa de JavaScript para guardar os carimbos neste dispositivo.</p></noscript>
  </body>
</html>
