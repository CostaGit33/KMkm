apply plugin: 'com.android.application'

def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def keystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def keyAliasValue = System.getenv('ANDROID_KEY_ALIAS')
def keyPasswordValue = System.getenv('ANDROID_KEY_PASSWORD')
def releaseSigningConfigured = [keystorePath, keystorePassword, keyAliasValue, keyPasswordValue].every { value -> value != null && !value.trim().isEmpty() }
def requireReleaseSigning = System.getenv('REQUIRE_ANDROID_RELEASE_SIGNING') == 'true'

if (requireReleaseSigning && !releaseSigningConfigured) {
    throw new GradleException('Assinatura Android obrigatória: configure ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS e ANDROID_KEY_PASSWORD.')
}

android {
    namespace = "online.novaagencian8n.mais1km"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "online.novaagencian8n.mais1km"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode (System.getenv('ANDROID_VERSION_CODE') ?: '1').toInteger()
        versionName System.getenv('ANDROID_VERSION_NAME') ?: '1.0.0'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions { ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~' }
    }
    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (releaseSigningConfigured) { signingConfig signingConfigs.release }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories { flatDir { dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs' } }

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) { apply plugin: 'com.google.gms.google-services' }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}