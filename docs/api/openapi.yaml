openapi: 3.0.3
info:
  title: +1 KM · API
  version: 8.12.0
  description: |
    API do +1 KM (Express + MySQL). Contrato escrito a partir das rotas de `server/index.js`, `server/admin.js`
    e `server/gamificacao.js`; se o código mudar, atualize este arquivo e a coleção em `docs/api/`.

    **Autenticação.** A conta usa um cookie de sessão `mais1km_session` (HttpOnly; `Secure; SameSite=None` em HTTPS,
    `SameSite=Lax` em HTTP). O token fica guardado só como hash no banco e vale 30 dias. As rotas legadas de apelido
    (`/api/entrar`, `/api/sair`, `/api/sessao`) existem apenas para tags antigas e também aceitam `Authorization: Bearer`.

    **Erros.** Sempre `{ "erro": "codigo_em_snake_case" }`. Limite de requisições por IP responde `429 muitas_tentativas`
    com o cabeçalho `Retry-After`. O contador fica na memória do processo (zera a cada reinício).

    Rotas `/api/*` que não existem respondem `404 { "erro": "rota_api_inexistente" }` (JSON, nunca HTML).

    Corpo JSON malformado responde `400 { "erro": "requisicao_invalida", "request_id": "…" }` e corpo acima de 100 kB
    responde `413 { "erro": "corpo_grande_demais", "request_id": "…" }`; ambos acontecem antes de qualquer rota e do limite de tentativas.

    **Rastreio.** Toda resposta de `/api/*` traz `X-Request-Id` (o servidor aceita um valor enviado pelo cliente com
    8 a 100 caracteres de `A-Za-z0-9._-`; senão gera um UUID). Falhas inesperadas respondem
    `500 { "erro": "interno", "request_id": "…" }`, e o mesmo id aparece no log JSON do servidor (`http_request` e `http_error`).
servers:
  - url: http://localhost:3000
    description: Desenvolvimento local
  - url: https://app.exemplo.com.br
    description: Produção (troque pelo domínio do Easypanel)
tags:
  - name: Sistema
    description: Saúde, configuração do mapa e catálogo público
  - name: Conta
    description: Cadastro, login, sessão e exclusão
  - name: Carimbos
    description: Toque na tag (NFC ou QR) e caderneta
  - name: Gamificação
    description: XP, medalhas e pódio (exigem conta)
  - name: Administração
    description: Exige conta com papel `admin`
  - name: Páginas públicas
    description: Exigidas pela Google Play
  - name: Legado
    description: Apelido anônimo com token, só para tags antigas
paths:
  /api/saude:
    get:
      operationId: saude
      tags: [Sistema]
      security: []
      summary: Saúde do serviço
      description: Só responde `ok` se o banco também responder.
      responses:
        '200':
          description: Serviço e banco no ar
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  banco: { type: string, example: ok }
                  versao: { type: string, example: local, description: 'Valor de RELEASE_VERSION; "desconhecida" se a variável não estiver definida.' }
        '500': { $ref: '#/components/responses/ErroInterno' }
  /api/config-mapa:
    get:
      operationId: configMapa
      tags: [Sistema]
      security: []
      summary: Chaves públicas do Google Maps
      description: Sem chave configurada, o app usa o mapa aberto (Leaflet/OSM). A chave do Google Maps é pública por natureza; restrinja-a por domínio no Google Cloud.
      responses:
        '200':
          description: Configuração do mapa
          headers:
            Cache-Control: { schema: { type: string, example: no-store } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  googleMapsKey: { type: string, nullable: true }
                  googleMapId: { type: string, nullable: true }
  /api/map-tiles/{z}/{x}/{y}.png:
    get:
      operationId: tileMapa
      tags: [Sistema]
      security: []
      summary: Tile do mapa (proxy do OpenStreetMap)
      description: 'Limite de 120 requisições por minuto por IP. Zoom de 0 a 19.'
      parameters:
        - { name: z, in: path, required: true, schema: { type: integer, minimum: 0, maximum: 19 } }
        - { name: x, in: path, required: true, schema: { type: integer, minimum: 0 } }
        - { name: 'y', in: path, required: true, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: Imagem PNG
          content:
            image/png: { schema: { type: string, format: binary } }
        '400': { $ref: '#/components/responses/Erro400' }
        '429': { $ref: '#/components/responses/MuitasTentativas' }
  /api/catalogo:
    get:
      operationId: catalogo
      tags: [Sistema]
      security: []
      summary: Catálogo público de pontos e circuitos
      description: |
        Inclui todos os pontos não arquivados, inclusive os de `status` diferente de `publicado`
        (o app trata `pendente` como ponto ainda não carimbável). Pontos com `oculto = true` também vêm na resposta.
      responses:
        '200':
          description: Catálogo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Catalogo' }
  /api/pontos/{codigo}/imagens:
    get:
      operationId: pontoImagens
      tags: [Sistema]
      security: []
      summary: Fotos aprovadas de um ponto
      description: |
        Só fotos com `status = aprovado`, na ordem definida pela administração. Não expõe hash, status nem caminhos de armazenamento.
        `url` (1400 px) e `miniatura_url` (320 px) são endereços imutáveis em `/midia/...`. Limite de 120 por minuto por IP.
      parameters:
        - { name: codigo, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Galeria
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GaleriaPublica' }
        '404': { description: '`ponto_inexistente`' }
        '429': { $ref: '#/components/responses/MuitasTentativas' }
  /midia/{arquivo}:
    get:
      operationId: midiaArquivo
      tags: [Sistema]
      security: []
      summary: Cópia pública de uma foto aprovada (WebP, sem EXIF/GPS)
      description: |
        Nome no formato `<id>.<hash16>.<g|m>.webp` (g = 1400 px, m = 320 px). Devolve `image/webp` com
        `Cache-Control: public, max-age=31536000, immutable`. Foto pendente, arquivada, hash errado ou variante inexistente: `404`.
        O original nunca sai por aqui.
      parameters:
        - { name: arquivo, in: path, required: true, schema: { type: string, pattern: '^\d+\.[0-9a-f]{16}\.(g|m)\.webp$' } }
      responses:
        '200': { description: Imagem WebP, content: { image/webp: { schema: { type: string, format: binary } } } }
        '404': { description: Não existe ou não está aprovada }
  /api/conta/criar:
    post:
      operationId: contaCriar
      tags: [Conta]
      security: []
      summary: Criar conta
      description: Cria a conta e já abre a sessão (cookie). Limite de 8 por 10 minutos por IP.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContaCriar' }
      responses:
        '201':
          description: Conta criada; cookie `mais1km_session` definido
          headers:
            Set-Cookie: { schema: { type: string }, description: 'mais1km_session=...; HttpOnly' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsuarioResposta' }
        '400': { $ref: '#/components/responses/DadosContaInvalidos' }
        '409':
          description: E-mail já cadastrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: email_ja_cadastrado }
        '429': { $ref: '#/components/responses/MuitasTentativas' }
  /api/conta/entrar:
    post:
      operationId: contaEntrar
      tags: [Conta]
      security: []
      summary: Entrar com e-mail e senha
      description: Limite de 12 por 10 minutos por IP. Esqueceu a senha? Use `/api/conta/recuperar-senha`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContaEntrar' }
      responses:
        '200':
          description: Sessão aberta; cookie definido
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsuarioResposta' }
        '401':
          description: E-mail ou senha não conferem
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: credenciais_invalidas }
        '429': { $ref: '#/components/responses/MuitasTentativas' }
  /api/conta/recuperar-senha:
    post:
      operationId: contaRecuperarSenha
      tags: [Conta]
      security: []
      summary: Pedir o e-mail de recuperação de senha
      description: |
        Sempre responde `200` com o mesmo corpo (e-mail inexistente, inválido, conta existente, falha do Resend ou
        recurso sem configuração), para não revelar quais e-mails têm conta. O e-mail sai depois da resposta, com um link
        `APP_PUBLIC_URL/?redefinir=TOKEN` válido por 30 minutos e de uso único; um pedido novo invalida os anteriores.
        Limites: 5 pedidos por 15 minutos por IP e 3 e-mails por hora por conta (acima disso continua `200`, sem e-mail).
        Exige `RESEND_API_KEY`, `RESEND_FROM` e `APP_PUBLIC_URL` (HTTPS).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, example: pessoa@exemplo.com }
      responses:
        '200':
          description: Resposta neutra
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecuperacaoNeutra' }
        '429': { $ref: '#/components/responses/MuitasTentativas' }
  /api/conta/redefinir-senha:
    post:
      operationId: contaRedefinirSenha
      tags: [Conta]
      security: []
      summary: Trocar a senha com o token do e-mail
      description: |
        Troca a senha, encerra todas as sessões da conta (o cookie é apagado) e inutiliza o token. Devolve o e-mail da
        conta para o app preencher o login. Limite de 10 por 15 minutos por IP, em contador separado do pedido.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, senha]
              properties:
                token: { type: string, description: Valor de `redefinir` no link recebido por e-mail }
                senha: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '200':
          description: Senha trocada
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  email: { type: string, nullable: true, example: pessoa@exemplo.com }
                  mensagem: { type: string }
        '400':
          description: Token inexistente, expirado ou já usado, ou senha fora de 8 a 128 caracteres
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              examples:
                token_invalido: { value: { erro: token_invalido_ou_expirado } }
                dados_invalidos: { value: { erro: token_ou_senha_invalidos } }
        '429': { $ref: '#/components/responses/MuitasTentativas' }
  /api/conta/sessao:
    get:
      operationId: contaSessao
      tags: [Conta]
      summary: Conta da sessão atual
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Conta logada
          content:
            application/json:
              schema:
                type: object
                properties:
                  usuario:
                    allOf:
                      - $ref: '#/components/schemas/Usuario'
                      - type: object
                        properties:
                          admin: { type: boolean }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
  /api/conta:
    put:
      operationId: contaAtualizar
      tags: [Conta]
      summary: Atualizar nome, e-mail e (opcionalmente) a senha
      description: Para trocar a senha envie `senhaNova` (8 a 128 caracteres) e `senhaAtual`.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContaAtualizar' }
      responses:
        '200':
          description: Dados salvos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsuarioResposta' }
        '400':
          description: Dados inválidos ou senha atual incorreta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              examples:
                dados: { value: { erro: dados_conta_invalidos } }
                senha: { value: { erro: senha_atual_invalida } }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404':
          description: Conta inexistente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '409':
          description: E-mail já em uso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: email_ja_cadastrado }
  /api/conta/sair:
    post:
      operationId: contaSair
      tags: [Conta]
      summary: Encerrar a sessão (revoga o token no servidor)
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Sessão encerrada e cookie removido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
  /api/eu:
    delete:
      operationId: contaExcluir
      tags: [Conta]
      summary: Excluir a conta e todos os carimbos
      description: Irreversível. Limite de 8 por 10 minutos por IP.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Conta, sessões e carimbos apagados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '429': { $ref: '#/components/responses/MuitasTentativas' }
  /api/tags/{codigo}/carimbar:
    post:
      operationId: tagCarimbar
      tags: [Carimbos]
      summary: Carimbar um ponto (toque na tag)
      description: |
        Cria o carimbo da rota (uma vez a cada 30 minutos; repetir dentro da janela devolve `repetido: true`).
        O primeiro carimbo de um ponto desbloqueia a carta (`criatura.nova = true`). Se houver evento ou patrocínio ativo
        no ponto, a resposta traz também `evento` com a edição numerada.
        Limite de 30 por minuto por IP.

        **Atenção:** o `codigo` da tag é público e fixo; hoje não há prova criptográfica de proximidade física.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: codigo, in: path, required: true, schema: { type: string }, example: eu-001 }
      responses:
        '200':
          description: Carimbo registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CarimboResposta' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404':
          description: Tag inexistente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: tag_inexistente }
        '409':
          description: Ponto ainda não publicado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: ponto_nao_publicado }
        '429': { $ref: '#/components/responses/MuitasTentativas' }
  /api/eventos/{slug}/carimbar:
    post:
      operationId: eventoCarimbar
      tags: [Carimbos]
      summary: Carimbar um card de evento ou patrocínio
      description: Fora da janela do evento responde 409 e não altera a rota.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                codigo: { type: string, description: Código da tag onde a pessoa está }
      responses:
        '200': { description: Carimbo do evento registrado }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404':
          description: Evento ou tag inexistente (`evento_inexistente`, `tag_inexistente`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '409':
          description: '`evento_nao_comecou`, `fora_da_janela`, `ponto_nao_publicado` ou `ponto_fora_do_evento`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '429': { $ref: '#/components/responses/MuitasTentativas' }
  /api/caderneta:
    get:
      operationId: caderneta
      tags: [Carimbos]
      summary: Caderneta da pessoa (rotas, carimbos, coleção e eventos)
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Caderneta
          content:
            application/json:
              schema:
                type: object
                properties:
                  usuario:
                    type: object
                    properties:
                      apelido: { type: string }
                  eventos: { type: array, items: { type: object } }
                  colecao: { $ref: '#/components/schemas/Colecao' }
                  rotas: { type: array, items: { type: object } }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
  /api/gamificacao/me:
    get:
      operationId: gamificacaoMe
      tags: [Gamificação]
      summary: XP, nível, medalhas e participação no pódio
      description: Exige conta (sessão de apelido anônimo não é aceita). Limite de 90 por minuto.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Resumo de gamificação
          content:
            application/json:
              schema:
                type: object
                properties:
                  xp:
                    type: object
                    properties:
                      total: { type: integer }
                      byPoints: { type: integer }
                      byRoutes: { type: integer }
                      uniquePoints: { type: integer }
                      completedRoutes: { type: integer }
                      level: { type: object }
                  medals: { type: array, items: { type: object } }
                  participation:
                    type: object
                    properties:
                      optedIn: { type: boolean }
                      alias: { type: string }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '429': { $ref: '#/components/responses/MuitasTentativas' }
  /api/gamificacao/podio:
    get:
      operationId: gamificacaoPodio
      tags: [Gamificação]
      summary: Pódio do mês ou geral
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: periodo, in: query, schema: { type: string, enum: [geral] }, description: 'Omita para o pódio do mês atual' }
        - { name: limite, in: query, schema: { type: integer, minimum: 3 } }
      responses:
        '200': { description: Classificação }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
  /api/gamificacao/participacao:
    put:
      operationId: gamificacaoParticipacao
      tags: [Gamificação]
      summary: Entrar ou sair do pódio público
      description: O apelido público tem de 2 a 30 caracteres e não pode conter `@`.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [optIn]
              properties:
                optIn: { type: boolean }
                alias: { type: string, minLength: 2, maxLength: 30 }
      responses:
        '200':
          description: Participação atualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  optedIn: { type: boolean }
                  alias: { type: string }
        '400':
          description: '`participacao_invalida` ou `apelido_publico_invalido`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
  /api/admin/eu:
    get:
      operationId: adminEu
      tags: [Administração]
      summary: Confirma que a conta é administradora
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Conta administradora
          content:
            application/json:
              schema:
                type: object
                properties:
                  admin: { type: boolean, example: true }
                  nome: { type: string }
                  email: { type: string }
                  conta_id: { type: integer }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
  /api/admin/dados:
    get:
      operationId: adminDados
      tags: [Administração]
      summary: Tudo que as telas do painel precisam (rotas, pontos, circuitos, eventos, patrocinadores)
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Dados do painel }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
  /api/admin/pontos:
    post:
      operationId: adminPontoCriar
      tags: [Administração]
      summary: Criar ponto
      description: '`codigo` em minúsculas (regex no servidor), `rota_id` de uma rota não arquivada. Status inicial `pendente`.'
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: Ponto criado }
        '400': { description: '`codigo_invalido` ou `rota_invalida`' }
        '409': { description: '`codigo_ja_existe`' }
        '403': { $ref: '#/components/responses/SemPermissao' }
  /api/admin/pontos/{codigo}:
    put:
      operationId: adminPontoEditar
      tags: [Administração]
      summary: Editar ponto (inclui os campos da carta)
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: codigo, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Salvo }
        '404': { description: '`ponto_inexistente`' }
        '403': { $ref: '#/components/responses/SemPermissao' }
    delete:
      operationId: adminPontoRemover
      tags: [Administração]
      summary: Remover ponto
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: codigo, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Removido }
        '403': { $ref: '#/components/responses/SemPermissao' }
  /api/admin/pontos/{codigo}/status:
    post:
      operationId: adminPontoStatus
      tags: [Administração]
      summary: Publicar, voltar a pendente ou arquivar um ponto
      description: Arquivar um ponto que está em evento aberto responde `409 ponto_em_evento`.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: codigo, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Status atualizado }
        '400': { description: '`status_invalido`' }
        '404': { description: '`ponto_inexistente`' }
        '409': { description: '`ponto_em_evento`' }
        '403': { $ref: '#/components/responses/SemPermissao' }
  /api/admin/midia/estado:
    get:
      operationId: adminMidiaEstado
      tags: [Administração]
      summary: Situação do armazenamento de fotos
      description: Com `?verificar=1` grava, lê e apaga um objeto de teste (registra na auditoria). Credenciais nunca aparecem na resposta.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: verificar, in: query, required: false, schema: { type: string, enum: ['1'] } }
      responses:
        '200': { description: '`tipo` (r2, local, desligado, r2-incompleto), `pronto`, `duravel`, `limite_mb` e, com verificar, `verificacao.ok`' }
        '403': { $ref: '#/components/responses/SemPermissao' }
  /api/admin/pontos/{codigo}/imagens:
    get:
      operationId: adminImagensDoPonto
      tags: [Administração]
      summary: Todas as fotos de um ponto (qualquer status)
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: codigo, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 'Fotos com status, hash, tamanhos e `original_url`, e `carta_imagem_id` (foto usada na carta, ou null)' }
        '404': { description: '`ponto_inexistente`' }
        '403': { $ref: '#/components/responses/SemPermissao' }
    post:
      operationId: adminImagemEnviar
      tags: [Administração]
      summary: Enviar foto (corpo = o arquivo)
      description: |
        `Content-Type` `image/jpeg`, `image/png` ou `image/webp`; metadados na query. Até 15 MB, 80 megapixels, lado menor de 400 px.
        O original é guardado intacto; a cópia pública (WebP 1400 px e miniatura 320 px) sai sem EXIF/GPS. Entra sempre `pendente`.
        Limite de 40 envios por 10 minutos por conta. Erros: `imagem_ja_enviada` (409), `imagem_grande_demais` (413),
        `formato_nao_aceito` (415), `imagem_invalida`, `imagem_pequena`, `imagem_animada`, `imagem_vazia`, `tipo_registro_invalido` (400),
        `midia_sem_armazenamento` (503), `midia_falha_armazenamento` (502).
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: codigo, in: path, required: true, schema: { type: string } }
        - { name: tipo_registro, in: query, schema: { type: string, enum: [atual, historica, restauracao, outra], default: atual } }
        - { name: titulo, in: query, schema: { type: string, maxLength: 120 } }
        - { name: legenda, in: query, schema: { type: string, maxLength: 400 } }
        - { name: periodo_historico, in: query, schema: { type: string, maxLength: 60 } }
        - { name: autor, in: query, schema: { type: string, maxLength: 120 } }
        - { name: fonte, in: query, schema: { type: string, maxLength: 200 } }
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        '201': { description: Foto criada (`imagem`) }
        '403': { $ref: '#/components/responses/SemPermissao' }
  /api/admin/pontos/{codigo}/imagens/ordem:
    put:
      operationId: adminImagensOrdem
      tags: [Administração]
      summary: Reordenar as fotos de um ponto
      description: 'Corpo `{ "ids": [..] }` com todas as fotos do ponto; a primeira aprovada vira a capa. Lista incompleta: `400 ordem_invalida`.'
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: codigo, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Ordem salva }
        '400': { description: '`ordem_invalida`' }
        '403': { $ref: '#/components/responses/SemPermissao' }
  /api/admin/imagens/{id}:
    put:
      operationId: adminImagemEditar
      tags: [Administração]
      summary: Editar metadados da foto
      description: 'Campos: titulo, legenda, periodo_historico, tipo_registro, autor, fonte e `derivada_de` (id de outra foto do mesmo ponto; só vale para `restauracao`).'
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Foto atualizada }
        '400': { description: '`tipo_registro_invalido` ou `derivada_invalida`' }
        '404': { description: '`foto_inexistente`' }
        '403': { $ref: '#/components/responses/SemPermissao' }
    delete:
      operationId: adminImagemExcluir
      tags: [Administração]
      summary: Excluir foto definitivamente
      description: Só foto que não está aprovada (`409 foto_aprovada`). Os arquivos saem do armazenamento primeiro; se o armazenamento falhar, a foto continua listada.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Excluída }
        '409': { description: '`foto_aprovada`' }
        '403': { $ref: '#/components/responses/SemPermissao' }
  /api/admin/imagens/{id}/status:
    post:
      operationId: adminImagemStatus
      tags: [Administração]
      summary: Aprovar, arquivar ou voltar a pendente
      description: 'Foto `historica` ou `restauracao` exige autor ou fonte para ser aprovada (`409 credito_pendente`); `{ "forcar": true }` libera e fica na auditoria.'
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Status atualizado }
        '400': { description: '`status_invalido`' }
        '409': { description: '`credito_pendente`' }
        '403': { $ref: '#/components/responses/SemPermissao' }
  /api/admin/imagens/{id}/carta:
    post:
      operationId: adminImagemCarta
      tags: [Administração]
      summary: Usar (ou deixar de usar) a foto como arte da carta do ponto
      description: 'Corpo `{ "usar": true|false }` (padrão true). Só foto aprovada (`409 foto_nao_aprovada`). A arte aparece na carta só depois do desbloqueio (`arte_foto` no álbum).'
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: '`{ ok, carta_imagem_id }`' }
        '409': { description: '`foto_nao_aprovada`' }
        '403': { $ref: '#/components/responses/SemPermissao' }
  /api/admin/imagens/{id}/original:
    get:
      operationId: adminImagemOriginal
      tags: [Administração]
      summary: Baixar o original (com os dados da câmera)
      description: Download byte a byte idêntico ao arquivo enviado. Só administrador.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Arquivo original, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        '404': { description: '`foto_inexistente` ou `arquivo_ausente`' }
        '403': { $ref: '#/components/responses/SemPermissao' }
  /api/admin/imagens/{id}/arquivo:
    get:
      operationId: adminImagemPrevia
      tags: [Administração]
      summary: Prévia de qualquer foto (inclusive pendente)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: v, in: query, schema: { type: string, enum: [g, m], default: m } }
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Imagem WebP, content: { image/webp: { schema: { type: string, format: binary } } } }
        '403': { $ref: '#/components/responses/SemPermissao' }
  /api/admin/usuarios:
    get:
      operationId: adminUsuarios
      tags: [Administração]
      summary: Lista de usuários
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Usuários }
        '403': { $ref: '#/components/responses/SemPermissao' }
  /api/admin/auditoria:
    get:
      operationId: adminAuditoria
      tags: [Administração]
      summary: Registro de ações administrativas
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Eventos de auditoria }
        '403': { $ref: '#/components/responses/SemPermissao' }
  /privacidade:
    get:
      operationId: paginaPrivacidade
      tags: [Páginas públicas]
      security: []
      summary: Política de Privacidade (HTML)
      responses:
        '200': { description: Página HTML, content: { text/html: { schema: { type: string } } } }
  /excluir-conta:
    get:
      operationId: paginaExcluirConta
      tags: [Páginas públicas]
      security: []
      summary: Como excluir a conta (HTML)
      responses:
        '200': { description: Página HTML, content: { text/html: { schema: { type: string } } } }
  /como-funciona:
    get:
      operationId: paginaComoFunciona
      tags: [Páginas públicas]
      security: []
      summary: Como funciona o +1 KM (HTML)
      responses:
        '200': { description: Página HTML, content: { text/html: { schema: { type: string } } } }
  /api/entrar:
    post:
      operationId: legadoEntrar
      tags: [Legado]
      security: []
      summary: Criar apelido anônimo com token (somente tags antigas)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [apelido]
              properties:
                apelido: { type: string, minLength: 2, maxLength: 30 }
                turma: { type: string, description: Código de convite da turma }
      responses:
        '200':
          description: Token e usuário
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  usuario: { type: object }
        '400':
          description: Apelido curto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: apelido_curto }
        '429': { $ref: '#/components/responses/MuitasTentativas' }
  /api/sessao:
    get:
      operationId: legadoSessao
      tags: [Legado]
      summary: Sessão de apelido anônimo
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '200': { description: Usuário }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
  /api/sair:
    post:
      operationId: legadoSair
      tags: [Legado]
      security: []
      summary: Remove o cookie (não revoga o token legado)
      responses:
        '200':
          description: Cookie removido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: mais1km_session
      description: Cookie de sessão definido por `/api/conta/criar` e `/api/conta/entrar`.
    bearerToken:
      type: http
      scheme: bearer
      description: Token legado de apelido anônimo.
  responses:
    NaoAutenticado:
      description: Sem sessão válida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
          example: { erro: nao_autenticado }
    SemPermissao:
      description: A conta não é administradora
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
          example: { erro: sem_permissao }
    DadosContaInvalidos:
      description: Nome (2 a 80), e-mail ou senha (8 a 128) inválidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
          example: { erro: dados_conta_invalidos }
    Erro400:
      description: Parâmetros inválidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    MuitasTentativas:
      description: Limite de requisições por IP excedido
      headers:
        Retry-After: { schema: { type: integer }, description: Segundos até poder tentar de novo }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
          example: { erro: muitas_tentativas }
    ErroInterno:
      description: Falha interna ou banco indisponível
      headers:
        X-Request-Id: { schema: { type: string }, description: Mesmo valor do campo request_id e do log do servidor }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
          example: { erro: interno, request_id: 3f6c1f4e-9a53-4c1c-8a0b-0d6f2f2f6b1e }
  schemas:
    RecuperacaoNeutra:
      type: object
      properties:
        ok: { type: boolean, example: true }
        mensagem: { type: string, example: 'Se o e-mail estiver cadastrado, você receberá as instruções para redefinir a senha.' }
    Erro:
      type: object
      required: [erro]
      properties:
        erro: { type: string, example: nao_autenticado }
        request_id: { type: string, description: 'Só nas falhas 500 (erro "interno"); cruze com o log do servidor.' }
    Ok:
      type: object
      properties:
        ok: { type: boolean, example: true }
    Usuario:
      type: object
      properties:
        id: { type: integer }
        conta_id: { type: integer }
        nome: { type: string }
        email: { type: string, format: email }
    UsuarioResposta:
      type: object
      properties:
        usuario: { $ref: '#/components/schemas/Usuario' }
    ContaCriar:
      type: object
      required: [nome, email, senha]
      properties:
        nome: { type: string, minLength: 2, maxLength: 80 }
        email: { type: string, format: email, maxLength: 160 }
        senha: { type: string, minLength: 8, maxLength: 128, format: password }
    ContaEntrar:
      type: object
      required: [email, senha]
      properties:
        email: { type: string, format: email }
        senha: { type: string, format: password }
    ContaAtualizar:
      type: object
      required: [nome, email]
      properties:
        nome: { type: string, minLength: 2, maxLength: 80 }
        email: { type: string, format: email }
        senhaAtual: { type: string, format: password }
        senhaNova: { type: string, minLength: 8, maxLength: 128, format: password }
    Catalogo:
      type: object
      properties:
        pontos:
          type: array
          items:
            type: object
            properties:
              codigo: { type: string, example: eu-001 }
              nome: { type: string }
              status: { type: string, enum: [pendente, publicado], description: 'Também pode vir outro status não arquivado' }
              lat: { type: number, nullable: true }
              lng: { type: number, nullable: true }
              endereco: { type: string, nullable: true }
              nota: { type: string, nullable: true }
              categorias: { type: array, items: { type: string } }
              icone: { type: string, nullable: true }
              fonte_mapa: { type: string, nullable: true }
              oculto: { type: boolean }
              capa: { type: string, nullable: true, description: 'Miniatura (`/midia/...`) da primeira foto aprovada' }
              fotos: { type: integer, description: 'Quantidade de fotos aprovadas' }
        circuitos:
          type: array
          items:
            type: object
            properties:
              slug: { type: string }
              nome: { type: string }
              subtitulo: { type: string, nullable: true }
              icone: { type: string, nullable: true }
              cor: { type: string }
              codigos: { type: array, items: { type: string } }
    GaleriaPublica:
      type: object
      properties:
        imagens:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              titulo: { type: string, nullable: true }
              legenda: { type: string, nullable: true }
              periodo_historico: { type: string, nullable: true }
              tipo_registro: { type: string, enum: [atual, historica, restauracao, outra] }
              autor: { type: string, nullable: true }
              fonte: { type: string, nullable: true }
              derivada: { type: boolean, description: 'true para versão restaurada de outra foto' }
              largura: { type: integer }
              altura: { type: integer }
              url: { type: string, example: /midia/12.0123456789abcdef.g.webp }
              miniatura_url: { type: string, example: /midia/12.0123456789abcdef.m.webp }
    Colecao:
      type: object
      description: Álbum de cartas da pessoa (uma carta por ponto publicado)
      properties:
        total: { type: integer }
        capturadas: { type: integer }
        por_categoria: { type: object, additionalProperties: { type: object } }
        itens: { type: array, items: { type: object } }
    CarimboResposta:
      type: object
      properties:
        carimbo: { type: object, description: 'Carimbo da rota com `tag_nome`, `ordem`, `forma`, `parceiro`, `cor`' }
        rota:
          type: object
          properties:
            nome: { type: string }
            total: { type: integer }
            feitos: { type: integer }
        repetido: { type: boolean }
        evento: { type: object, nullable: true }
        criatura:
          type: object
          properties:
            nome: { type: string }
            raridade: { type: string }
            nova: { type: boolean, description: Verdadeiro no primeiro carimbo do ponto }
            capturadas: { type: integer }
            total: { type: integer }
            carta: { type: object, nullable: true }
        hoje: { type: integer }
        turma: { type: object, nullable: true }
        guardiao: { type: object, nullable: true }
        certificado: { type: boolean }
