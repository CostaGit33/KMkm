# Build de release assinado do app Android Capacitor (AAB para a Play Console + APK).
# Roda somente manualmente e exige a chave de assinatura em GitHub Secrets.
#
# Secrets necessários:
#   ANDROID_KEYSTORE_BASE64    keystore .jks em base64
#   ANDROID_KEYSTORE_PASSWORD  senha do keystore
#   ANDROID_KEY_ALIAS          alias da chave
#   ANDROID_KEY_PASSWORD       senha da chave
name: Android Capacitor - Release assinado

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capacitor-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Gerar AAB e APK Capacitor assinados
    runs-on: ubuntu-24.04
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Conferir secrets de assinatura
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          faltando=""
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || faltando="$faltando ANDROID_KEYSTORE_BASE64"
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || faltando="$faltando ANDROID_KEYSTORE_PASSWORD"
          [ -n "$ANDROID_KEY_ALIAS" ] || faltando="$faltando ANDROID_KEY_ALIAS"
          [ -n "$ANDROID_KEY_PASSWORD" ] || faltando="$faltando ANDROID_KEY_PASSWORD"
          if [ -n "$faltando" ]; then
            echo "::error::Secrets ausentes:$faltando (veja docs/PLAY-STORE.md)"
            exit 1
          fi

      - name: Configurar Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependências do cliente
        run: npm ci --prefix client

      - name: Testar e compilar frontend
        run: |
          npm test --prefix client
          npm run build:android --prefix client

      - name: Restaurar keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mais1km-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mais1km-release.jks" >> "$GITHUB_ENV"

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Sincronizar Capacitor
        working-directory: client
        run: npx cap sync android

      - name: Mostrar SHA-256 do certificado
        run: |
          keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD | grep -E "SHA256:|Owner:|Valid from:"

      - name: Gerar AAB e APK de release
        working-directory: client/android
        run: ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Gerar checksums
        run: |
          sha256sum client/android/app/build/outputs/bundle/release/app-release.aab > client/android/app-release.aab.sha256
          sha256sum client/android/app/build/outputs/apk/release/app-release.apk > client/android/app-release.apk.sha256

      - name: Publicar artefatos Capacitor assinados
        uses: actions/upload-artifact@v4
        with:
          name: mais1km-capacitor-release-assinado
          path: |
            client/android/app/build/outputs/bundle/release/app-release.aab
            client/android/app/build/outputs/apk/release/app-release.apk
            client/android/app-release.aab.sha256
            client/android/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Apagar keystore do runner
        if: always()
        run: rm -f "$RUNNER_TEMP/mais1km-release.jks"
