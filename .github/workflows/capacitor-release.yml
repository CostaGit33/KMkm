name: Capacitor - Release Google Play

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode inteiro, maior que o último enviado à Play Console'
        required: true
        type: string
      version_name:
        description: 'Versão comercial, por exemplo 1.0.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: capacitor-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validar e gerar AAB assinado
    runs-on: ubuntu-24.04
    env:
      ANDROID_VERSION_CODE: ${{ inputs.version_code }}
      ANDROID_VERSION_NAME: ${{ inputs.version_name }}
      REQUIRE_ANDROID_RELEASE_SIGNING: 'true'
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validar versão e secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [[ "$ANDROID_VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || { echo '::error::version_code deve ser inteiro positivo.'; exit 1; }
          [[ "$ANDROID_VERSION_NAME" =~ ^[0-9]+([.][0-9]+){1,3}([+-][A-Za-z0-9.-]+)?$ ]] || { echo '::error::version_name inválido.'; exit 1; }
          missing=''
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then echo "::error::Secrets ausentes:$missing"; exit 1; fi
      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Instalar dependências web
        run: npm ci --prefix client
      - name: Testes do cliente
        run: npm test --prefix client
      - name: Build do bundle web para Android
        run: npm run build:android --prefix client
      - name: Sincronizar Capacitor
        working-directory: client
        run: npx cap sync android
      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Configurar Android SDK API 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Restaurar keystore temporário
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mais1km-upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mais1km-upload.jks" >> "$GITHUB_ENV"
      - name: Validar certificado e compilar AAB/APK
        working-directory: client/android
        run: |
          keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass:env ANDROID_KEYSTORE_PASSWORD | grep -E 'SHA256:|Owner:|Valid from:'
          chmod +x ./gradlew
          ./gradlew --no-daemon clean bundleRelease assembleRelease
      - name: Validar artefatos e checksums
        working-directory: client/android
        run: |
          test -s app/build/outputs/bundle/release/app-release.aab
          test -s app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/bundle/release/app-release.aab > app-release.aab.sha256
          sha256sum app/build/outputs/apk/release/app-release.apk > app-release.apk.sha256
      - name: Publicar artefatos de release
        uses: actions/upload-artifact@v4
        with:
          name: mais1km-capacitor-release-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: |
            client/android/app/build/outputs/bundle/release/app-release.aab
            client/android/app/build/outputs/apk/release/app-release.apk
            client/android/app-release.aab.sha256
            client/android/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Remover keystore do runner
        if: always()
        run: rm -f "$RUNNER_TEMP/mais1km-upload.jks"