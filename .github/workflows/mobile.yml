# Pipeline de validação do aplicativo Flutter Android.
# Publica APKs debug e release de teste somente após análise e testes aprovados.
name: Mobile - Flutter CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'feat/**'
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Analisar, testar e gerar APK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Registrar versões
        run: |
          flutter --version
          dart --version
          java -version

      - name: Instalar dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze --fatal-infos

      - name: Testes
        run: flutter test --reporter expanded

      - name: Gerar APK de depuração
        run: flutter build apk --debug

      - name: Gerar APK otimizado para teste
        run: flutter build apk --release

      - name: Gerar checksums
        run: |
          sha256sum build/app/outputs/flutter-apk/app-debug.apk > app-debug.apk.sha256
          sha256sum build/app/outputs/flutter-apk/app-release.apk > app-release.apk.sha256
          ls -lh build/app/outputs/flutter-apk/*.apk

      - name: Publicar APK debug
        uses: actions/upload-artifact@v4
        with:
          name: mais1km-android-debug
          path: |
            mobile/build/app/outputs/flutter-apk/app-debug.apk
            mobile/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publicar APK release de teste
        uses: actions/upload-artifact@v4
        with:
          name: mais1km-android-release-test
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 14
