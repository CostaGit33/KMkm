name: Mobile - Flutter CI

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Analisar, testar e gerar APK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Registrar versões
        run: |
          flutter --version
          dart --version
          java -version

      - name: Instalar dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze --fatal-infos

      - name: Testes
        run: flutter test --reporter expanded

      - name: Gerar APK de depuração
        run: flutter build apk --debug

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: mais1km-android-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
