name: Capacitor - Bootstrap Android

on:
  push:
    branches:
      - feat/capacitor-android-pwa
    paths:
      - .github/workflows/capacitor-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: capacitor-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Instalar Capacitor e gerar projeto Android
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Adicionar scripts do Capacitor
        working-directory: client
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          pkg.scripts = {
            ...pkg.scripts,
            'build:android': 'vite build --mode android',
            'cap:sync:android': 'npm run build:android && cap sync android',
            'cap:open:android': 'cap open android',
            'cap:run:android': 'cap run android'
          };
          fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\\n');
          NODE

      - name: Instalar Capacitor 8.6.0
        run: |
          npm install --prefix client --save-exact @capacitor/core@8.6.0 @capacitor/android@8.6.0
          npm install --prefix client --save-dev --save-exact @capacitor/cli@8.6.0

      - name: Validar build PWA original
        run: npm run build --prefix client

      - name: Gerar build web específico do Android
        run: npm run build:android --prefix client

      - name: Gerar projeto Android nativo
        working-directory: client
        run: npx cap add android

      - name: Sincronizar bundle e plugins
        working-directory: client
        run: npx cap sync android

      - name: Versionar dependências e projeto Android
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/package.json client/package-lock.json client/android
          if git diff --cached --quiet; then
            echo "Nenhuma alteração gerada para versionar."
            exit 1
          fi
          git commit -m "build(android): gerar projeto nativo Capacitor"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Compilar APK debug
        working-directory: client/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Publicar APK de validação
        uses: actions/upload-artifact@v4
        with:
          name: mais1km-capacitor-debug
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
