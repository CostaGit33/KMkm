name: PWA - Build

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "shared/**"
      - ".github/workflows/pwa.yml"
  pull_request:
    branches: [main]
    paths:
      - "client/**"
      - "shared/**"
      - ".github/workflows/pwa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pwa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar PWA
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependências
        run: npm ci --prefix client

      - name: Compilar frontend web
        run: npm run build --prefix client

  capacitor-android:
    name: Gerar e validar Android Capacitor
    if: >-
      ${{ github.event_name == 'pull_request'
          && github.event.pull_request.head.ref == 'feat/capacitor-android-pwa'
          && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar branch do PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependências atuais
        run: npm ci --prefix client

      - name: Preparar scripts do cliente
        working-directory: client
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.scripts = {
            ...pkg.scripts,
            'build:android': 'vite build --mode android',
            'cap:sync:android': 'npm run build:android && cap sync android',
            'cap:open:android': 'cap open android',
            'cap:run:android': 'cap run android'
          };
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Instalar Capacitor 8.6.0 e plugins nativos
        run: |
          npm install --prefix client --save-exact @capacitor/core@8.6.0 @capacitor/android@8.6.0
          npm install --prefix client --save-dev --save-exact @capacitor/cli@8.6.0
          npm install --prefix client --save-exact @capacitor/app@8.1.2 @capacitor/geolocation@8.2.4

      - name: Validar build PWA sem configuração Android
        run: npm run build --prefix client

      - name: Compilar bundle Android
        run: npm run build:android --prefix client

      - name: Criar plataforma Android se ainda não existir
        run: |
          if [ ! -f client/android/app/build.gradle ] && [ ! -f client/android/app/build.gradle.kts ]; then
            cd client
            npx cap add android
          fi

      - name: Sincronizar Capacitor
        working-directory: client
        run: npx cap sync android

      - name: Versionar package-lock e projeto Android gerado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/package.json client/package-lock.json client/android
          if ! git diff --cached --quiet; then
            git commit -m "build(android): gerar projeto nativo Capacitor"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          else
            echo "Dependências e projeto Android já estão atualizados."
          fi

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Compilar APK debug
        working-directory: client/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Publicar APK de validação
        uses: actions/upload-artifact@v4
        with:
          name: mais1km-capacitor-debug
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
