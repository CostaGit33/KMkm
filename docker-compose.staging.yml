services:
  db-staging:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Defina MYSQL_DATABASE em .env.staging}
      MYSQL_USER: ${MYSQL_USER:?Defina MYSQL_USER em .env.staging}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD em .env.staging}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD em .env.staging}
    volumes:
      - mais1km_staging_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - mais1km-staging

  app-staging:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      PORT: 3000
      NODE_ENV: production
      MEDIA_DIR: /data/media
    ports:
      - "${STAGING_HTTP_PORT:-3001}:3000"
    volumes:
      - mais1km_staging_media:/data/media
    depends_on:
      db-staging:
        condition: service_healthy
    networks:
      - mais1km-staging

networks:
  mais1km-staging:
    name: mais1km-staging
    driver: bridge

volumes:
  mais1km_staging_mysql_data:
    name: mais1km_staging_mysql_data
  mais1km_staging_media:
    name: mais1km_staging_media
